<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="bg" cx="34%" cy="28%" r="85%">
      <stop offset="0%" stop-color="#3f8ce0"/>
      <stop offset="55%" stop-color="#2a78d6"/>
      <stop offset="100%" stop-color="#1c5cab"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="42%" r="52%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>
  <circle cx="512" cy="440" r="420" fill="url(#halo)"/>

  <!-- 四化小星點，暗示紫微斗數，尺寸夠大在小尺寸下仍可辨識為裝飾 -->
  <circle cx="256" cy="220" r="10" fill="#ffffff" opacity="0.55"/>
  <circle cx="800" cy="260" r="7" fill="#ffffff" opacity="0.4"/>
  <circle cx="840" cy="760" r="9" fill="#ffffff" opacity="0.45"/>
  <circle cx="190" cy="770" r="6" fill="#ffffff" opacity="0.35"/>

  <text x="512" y="660" text-anchor="middle"
        font-family="'PingFang TC','Microsoft JhengHei','WenQuanYi Zen Hei',sans-serif"
        font-size="560" font-weight="700" fill="#ffffff">紫</text>
</svg>
