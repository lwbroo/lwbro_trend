<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0e7c66">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Glyco Navigator · Eat in the Right Order</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="app-header">
  <div class="header-actions">
    <button id="lang-toggle" class="round-btn" title="Language" aria-label="Switch language">EN</button>
    <button id="theme-toggle" class="round-btn" title="Switch theme" aria-label="Switch theme">🌗</button>
  </div>
  <h1>Glyco Navigator</h1>
  <p class="tagline" data-i18n="tagline"></p>
</header>

<main>

<!-- ═══════════ Analyze ═══════════ -->
<section id="tab-analyze" class="tab-panel active">

  <div id="quota-chip" class="quota-chip hidden"></div>

  <div id="paywall-modal" class="modal-overlay hidden">
    <div class="modal-card">
      <h2 data-i18n="quota_exceeded_title"></h2>
      <p id="paywall-body" class="hint-text"></p>
      <button class="btn primary full hidden" id="paywall-upgrade-btn" data-i18n="upgrade_cta"></button>
      <p class="hint-text center" id="paywall-web-hint" data-i18n="upgrade_native_only_hint"></p>
      <button class="btn full" id="paywall-close-btn" data-i18n="paywall_close"></button>
    </div>
  </div>

  <div id="today-card" class="card today-card hidden">
    <div class="today-head">
      <h2 data-i18n="today"></h2>
      <span id="streak-badge" class="streak-badge hidden"></span>
    </div>
    <div id="today-chips" class="chips"></div>
  </div>

  <div class="card">
    <label class="photo-drop" id="photo-drop">
      <input type="file" id="photo-input" accept="image/*" hidden>
      <div id="photo-placeholder">
        <div class="big-icon">📷</div>
        <div data-i18n="photo_ph"></div>
      </div>
      <img id="photo-preview" class="hidden" alt="meal photo preview">
    </label>

    <input type="text" id="meal-note" class="text-input" data-i18n-ph="note_ph">

    <button class="btn primary full" id="analyze-btn" data-i18n="analyze" disabled></button>
  </div>

  <div id="loading" class="card center hidden">
    <div class="spinner"></div>
    <div id="loading-text" data-i18n="loading"></div>
  </div>

  <div id="error-box" class="card error hidden"></div>

  <div id="result" class="hidden">
    <div class="card order-card">
      <h2 data-i18n="order_title"></h2>
      <ol id="order-list" class="order-list"></ol>
      <p class="hint-text" data-i18n="order_hint"></p>
    </div>

    <div class="card">
      <h2 data-i18n="meal_title"></h2>
      <div id="summary-chips" class="chips"></div>
      <p id="meal-summary" class="summary"></p>
      <div id="food-list"></div>
    </div>

    <div id="burn-card" class="card burn-card hidden">
      <h2 data-i18n="burn_title"></h2>
      <p id="burn-text" class="burn-text"></p>
      <div id="burn-options" class="burn-options"></div>
    </div>

    <div class="card">
      <h2 data-i18n="tips_title"></h2>
      <ul id="tips-list" class="tips-list"></ul>
    </div>

    <button class="btn primary full" id="save-btn" data-i18n="save"></button>
    <p id="save-done" class="center hint-text hidden" data-i18n="saved"></p>
  </div>

</section>

<!-- ═══════════ Log ═══════════ -->
<section id="tab-history" class="tab-panel">
  <div id="history-empty" class="card center" data-i18n-html="log_empty"></div>
  <div id="history-list"></div>
</section>

<!-- ═══════════ Trends (personal evidence) ═══════════ -->
<section id="tab-trends" class="tab-panel">
  <div class="card">
    <h2 data-i18n="trends_intro_title"></h2>
    <p class="hint-text" data-i18n="trends_intro_text"></p>
  </div>
  <div id="trends-content"></div>
</section>

<!-- ═══════════ Settings ═══════════ -->
<section id="tab-settings" class="tab-panel">
  <div class="card">
    <h2 data-i18n="lang_title"></h2>
    <div class="seg" id="lang-seg">
      <button class="seg-btn" data-lang="en">English</button>
      <button class="seg-btn" data-lang="zh">中文</button>
    </div>
  </div>

  <div id="subscription-card" class="card hidden">
    <h2 data-i18n="subscription_title"></h2>
    <!-- Filled by updateSubscriptionCard(); no data-i18n, or I18n.apply() would clobber
         a subscribed user's status with the free-plan string on every language switch. -->
    <p id="subscription-status" class="hint-text"></p>
    <button class="btn full" id="restore-purchases-btn" data-i18n="subscription_restore"></button>
  </div>

  <div class="card">
    <h2 data-i18n="data_title"></h2>
    <button class="btn full" id="export-btn" data-i18n="export"></button>
    <button class="btn full danger" id="clear-btn" data-i18n="clear"></button>
  </div>

  <div class="card">
    <h2 data-i18n="sources_title"></h2>
    <p class="hint-text" data-i18n="sources_desc"></p>
  </div>

  <p class="hint-text center" data-i18n-html="disclaimer"></p>
  <p class="hint-text center"><a href="privacy.html" target="_blank" rel="noopener" data-i18n="privacy_link"></a></p>
</section>

</main>

<nav class="bottom-nav" id="tabs">
  <button class="tab active" data-tab="analyze"><span class="tab-icon">📷</span><span data-i18n="nav_analyze"></span></button>
  <button class="tab" data-tab="history"><span class="tab-icon">📒</span><span data-i18n="nav_log"></span></button>
  <button class="tab" data-tab="trends"><span class="tab-icon">📊</span><span data-i18n="nav_trends"></span></button>
  <button class="tab" data-tab="settings"><span class="tab-icon">⚙️</span><span data-i18n="nav_settings"></span></button>
</nav>

<script src="js/i18n.js"></script>
<script src="js/store.js"></script>
<script src="js/gidb.js"></script>
<script src="js/order.js"></script>
<script src="js/api.js"></script>
<script src="js/charts.js"></script>
<script src="js/vendor/purchases-capacitor.js"></script>
<script src="js/app.js"></script>
</body>
</html>
