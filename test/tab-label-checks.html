<!doctype html>
<html lang="en"><meta charset="utf-8"><title>Local tab label checks</title>
<pre id="result">running</pre>
<iframe id="app" title="Synthetic tab navigation" style="width:375px;height:667px;border:0"></iframe>
<script>
(async () => {
  const result = document.querySelector('#result'), frame = document.querySelector('#app');
  const checks = [], layouts = [];
  const wait = ms => new Promise(resolve => setTimeout(resolve, ms));
  const check = (name, ok, detail) => checks.push({ name, ok: !!ok, ...(detail ? { detail } : {}) });
  const capture = new URLSearchParams(location.search).get('capture');
  try {
    localStorage.clear();
    frame.src = '../native/ios/App/App/public/index.html?tab-label-qa';
    await new Promise(resolve => frame.onload = resolve);
    const doc = frame.contentDocument, win = frame.contentWindow;
    for (let attempt = 0; !win.ZWBZI18n && attempt < 100; attempt++) await wait(30);
    if (!win.ZWBZI18n) throw Error('App startup timeout');
    const visibleTabs = () => [...doc.querySelectorAll('.tab')].filter(button => win.getComputedStyle(button).display !== 'none');
    if (capture) {
      result.hidden = true;
      frame.style.cssText = 'position:fixed;inset:0;width:100%;height:100%;border:0';
      win.ZWBZI18n.setLanguage(capture.startsWith('zh') ? 'zh-Hant' : 'en');
      doc.documentElement.style.fontSize = capture.endsWith('large') ? '24px' : '16px';
      doc.querySelector('[data-tab="settings"]').click();
      await wait(100);
      result.dataset.status = 'captured';
      await new Promise(() => {});
    }
    for (const language of ['en', 'zh-Hant']) {
      win.ZWBZI18n.setLanguage(language);
      for (const width of [320, 375, 430]) {
        frame.style.width = width + 'px';
        for (const font of [16, 24, 32, 48]) {
          doc.documentElement.style.fontSize = font + 'px';
          await wait(30);
          const prefix = language + '/' + width + 'px/' + font + 'px';
          let whole = true, bounds = true, targets = true, hit = true, activated = true;
          const measurements = [];
          for (const button of visibleTabs()) {
            // Actual target geometry plus controller activation; no claim of physical touch/VoiceOver.
            win.scrollTo(0, 0);
            button.scrollIntoView({ block: 'nearest', inline: 'nearest' });
            await wait(10);
            const box = button.getBoundingClientRect();
            hit &&= doc.elementFromPoint(box.left + box.width / 2, box.top + box.height / 2) === button;
            button.click();
            await wait(10);
            activated &&= button.classList.contains('active') && button.getAttribute('aria-current') === 'page' && doc.querySelector('#tab-' + button.dataset.tab).classList.contains('active');
            const range = doc.createRange(); range.selectNodeContents(button);
            const text = range.getClientRects(), rect = button.getBoundingClientRect();
            const css = win.getComputedStyle(button);
            const contentWidth = rect.width - parseFloat(css.paddingLeft) - parseFloat(css.paddingRight) - parseFloat(css.borderLeftWidth) - parseFloat(css.borderRightWidth);
            whole &&= text.length === 1 && text[0].width <= contentWidth + 1 && button.scrollWidth <= button.clientWidth + 1;
            bounds &&= rect.left >= -1 && rect.right <= win.innerWidth + 1;
            targets &&= rect.width >= 44 && rect.height >= 44;
            measurements.push({ label: button.textContent, lines: text.length, width: rect.width, height: rect.height, top: rect.top });
          }
          check(prefix + ' whole labels without truncation or letter wrapping', whole, measurements);
          check(prefix + ' buttons stay inside page width', bounds);
          check(prefix + ' targets at least 44 by 44', targets);
          check(prefix + ' visible hit targets activate every matching panel', hit && activated);
          check(prefix + ' page has no horizontal overflow', doc.documentElement.scrollWidth <= doc.documentElement.clientWidth + 1);
          layouts.push({ language, width, font, rows: new Set(measurements.map(m => Math.round(m.top))).size, measurements });
        }
      }
    }
    check('native release keeps exactly five available tabs', visibleTabs().length === 5);
    check('test creates no birth profile or saved journal', localStorage.getItem('zwbz.profile') === null && localStorage.getItem('zwbz.records') === null);
    result.dataset.status = checks.every(item => item.ok) ? 'passed' : 'failed';
    result.textContent = JSON.stringify({ syntheticOnly: true, scope: 'Real Chromium DOM; CSS font scaling, not iOS Dynamic Type or VoiceOver', passed: checks.filter(c => c.ok).length, checks, layouts }, null, 2);
  } catch (error) {
    result.dataset.status = 'failed';
    result.textContent = JSON.stringify({ error: String(error), checks, layouts }, null, 2);
  }
})();
</script></html>
